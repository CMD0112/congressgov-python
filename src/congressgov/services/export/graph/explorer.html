    const matrixCanvas = document.getElementById("matrixCanvas");
    const matrixCtx = matrixCanvas.getContext("2d");
    let matrixHover = null;

    function resizeMatrixCanvas() {
      const rect = matrixCanvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      matrixCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
      matrixCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
      matrixCanvas.style.width = `${rect.width}px`;
      matrixCanvas.style.height = `${rect.height}px`;
      matrixCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawMatrix() {
      resizeMatrixCanvas();
      const rows = matrixView.rows || [];
      const cells = matrixView.cells || [];
      const size = rows.length;
      const width = matrixCanvas.clientWidth;
      const height = matrixCanvas.clientHeight;
      const margin = { top: 48, left: 120, right: 24, bottom: 24 };
      const plotW = Math.max(width - margin.left - margin.right, 1);
      const plotH = Math.max(height - margin.top - margin.bottom, 1);
      const cellW = size ? plotW / size : plotW;
      const cellH = size ? plotH / size : plotH;

      matrixCtx.fillStyle = "#0f172a";
      matrixCtx.fillRect(0, 0, width, height);

      if (!size) {
        matrixCtx.fillStyle = "#94a3b8";
        matrixCtx.font = "14px Inter, Segoe UI, sans-serif";
        matrixCtx.fillText("No matrix data for this slice.", margin.left, margin.top);
        return;
      }

      const filteredCells = cells.filter((cell) => {
        const sourceParty = graph.hasNode(cell.row) ? (graph.getNodeAttributes(cell.row).party || "Unknown") : "Unknown";
        const targetParty = graph.hasNode(cell.column) ? (graph.getNodeAttributes(cell.column).party || "Unknown") : "Unknown";
        if (!uiState.partyFilter.has(sourceParty) || !uiState.partyFilter.has(targetParty)) return false;
        if ((cell.weight || 0) < uiState.minEdgeWeight) return false;
        if (uiState.crossPartyOnly && !(cell.crossPartyWeight || 0)) return false;
        return true;
      });

      const maxWeight = Math.max(...filteredCells.map((c) => c.weight || 0), 1);

      filteredCells.forEach((cell) => {
        const x = margin.left + cell.columnIndex * cellW;
        const y = margin.top + cell.rowIndex * cellH;
        const intensity = (cell.weight || 0) / maxWeight;
        const crossParty = (cell.crossPartyWeight || 0) > 0;
        matrixCtx.fillStyle = crossParty
          ? `rgba(192, 132, 252, ${0.15 + intensity * 0.75})`
          : `rgba(100, 116, 139, ${0.12 + intensity * 0.65})`;
        matrixCtx.fillRect(x + 0.5, y + 0.5, Math.max(cellW - 1, 1), Math.max(cellH - 1, 1));
      });

      matrixCtx.strokeStyle = "rgba(148, 163, 184, 0.12)";
      for (let i = 0; i <= size; i += 1) {
        matrixCtx.beginPath();
        matrixCtx.moveTo(margin.left + i * cellW, margin.top);
        matrixCtx.lineTo(margin.left + i * cellW, margin.top + plotH);
        matrixCtx.stroke();
        matrixCtx.beginPath();
        matrixCtx.moveTo(margin.left, margin.top + i * cellH);
        matrixCtx.lineTo(margin.left + plotW, margin.top + i * cellH);
        matrixCtx.stroke();
      }

      matrixCtx.fillStyle = "#cbd5e1";
      matrixCtx.font = "11px Inter, Segoe UI, sans-serif";
      rows.forEach((rowKey, index) => {
        const label = (matrixView.labels && matrixView.labels[rowKey]) || rowKey;
        const short = label.length > 16 ? `${label.slice(0, 15)}…` : label;
        matrixCtx.fillText(short, 8, margin.top + index * cellH + cellH / 2 + 4);
      });

      matrixCtx.fillStyle = "#94a3b8";
      matrixCtx.font = "12px Inter, Segoe UI, sans-serif";
      let meta = `${filteredCells.length} cells · ${size}×${size}`;
      if (matrixView.truncated) meta += ` (truncated from ${matrixView.totalNodes})`;
      matrixCtx.fillText(meta, margin.left, 20);

      if (matrixHover) {
        const { cell } = matrixHover;
        const rowLabel = (matrixView.labels && matrixView.labels[cell.row]) || cell.row;
        const colLabel = (matrixView.labels && matrixView.labels[cell.column]) || cell.column;
        selection.innerHTML = `<strong>${rowLabel} → ${colLabel}</strong><br>
          Weight: ${cell.weight} · Cross-party: ${cell.crossPartyWeight || 0}`;
      }
    }

    matrixCanvas.addEventListener("mousemove", (event) => {
      if (uiState.viewMode !== "matrix") return;
      const rows = matrixView.rows || [];
      const size = rows.length;
      if (!size) return;
      const rect = matrixCanvas.getBoundingClientRect();
      const margin = { top: 48, left: 120, right: 24, bottom: 24 };
      const plotW = Math.max(rect.width - margin.left - margin.right, 1);
      const plotH = Math.max(rect.height - margin.top - margin.bottom, 1);
      const cellW = plotW / size;
      const cellH = plotH / size;
      const x = event.clientX - rect.left - margin.left;
      const y = event.clientY - rect.top - margin.top;
      if (x < 0 || y < 0 || x >= plotW || y >= plotH) {
        matrixHover = null;
        return;
      }
      const col = Math.floor(x / cellW);
      const row = Math.floor(y / cellH);
      const rowKey = rows[row];
      const colKey = rows[col];
      const match = (matrixView.cells || []).find((cell) =>
        cell.rowIndex === row && cell.columnIndex === col
        && edgePassesFilters("tmp", { weight: cell.weight, crossPartyWeight: cell.crossPartyWeight }, [cell.row, cell.column])

      matrixHover = match ? { cell: match, rowKey, colKey } : null;

      applyLayout(event.target.value);
    });

    document.querySelectorAll(".preset-row button").forEach((button) => {
      button.addEventListener("click", () => applyFilterPreset(button.dataset.preset));
    });

    document.getElementById("exportJson").addEventListener("click", exportFilteredJson);

    document.getElementById("egoCenter").addEventListener("change", (event) => {
      setEgoCenter(event.target.value);
    });

    document.getElementById("egoCenterSearch")?.addEventListener("input", (event) => {
      filterEgoCenterOptions(event.target.value);
    });

    document.querySelectorAll("#egoHopChips button").forEach((button) => {
      button.addEventListener("click", () => setEgoHops(Number(button.dataset.hops)));
    });

    document.getElementById("viewEgoBtn").addEventListener("click", () => {
      const memberId = activeMemberForEgo();
      if (memberId) openEgoForMember(memberId);
    });

    document.getElementById("selectionViewEgo").addEventListener("click", () => {
      const memberId = uiState.pinnedNode || hoveredNode;
      if (memberId) openEgoForMember(memberId);
    });

    document.getElementById("useFocusedMember").addEventListener("click", () => {
      const focused = uiState.pinnedNode || hoveredNode;
      if (focused && graph.hasNode(focused)) {
        setEgoCenter(focused);
      }
    });

    const egoHopsInput = document.getElementById("egoHops");
    const egoHopsValue = document.getElementById("egoHopsValue");
    egoHopsInput.addEventListener("input", (event) => {
      setEgoHops(Number(event.target.value));
    });

    const searchInput = document.getElementById("search");
    const searchResults = document.getElementById("searchResults");

    function renderSearchResults(query) {
      if (!query) {
        searchResults.hidden = true;
        searchResults.innerHTML = "";
        return;
      }
      const matches = [];
      graph.forEachNode((key, attrs) => {
        if (matches.length >= 8) return;
        if (key.toLowerCase().includes(query) || nodeDisplayLabel(attrs, key).toLowerCase().includes(query)) {
          matches.push({ key, label: nodeDisplayLabel(attrs, key), party: attrs.party || "?" });
        }
      });
      if (!matches.length) {
        searchResults.hidden = false;
        searchResults.innerHTML = `<div class="muted">No members match "${query}".</div>`;
        return;
      }
      searchResults.hidden = false;
      searchResults.innerHTML = matches.map((match) => `
        <div class="result-row">
          <button type="button" data-node="${match.key}">
            ${escapeHtml(match.label)} <span class="muted">(${escapeHtml(match.party)})</span>
          </button>
          <button type="button" class="result-ego" data-node-ego="${match.key}" title="View ego network">Ego</button>
        </div>
      `).join("");
      searchResults.querySelectorAll("button[data-node]").forEach((button) => {
        button.addEventListener("click", () => {
          if (uiState.viewMode !== "graph" && uiState.viewMode !== "ego") switchView("graph");
          focusNode(button.dataset.node, { zoom: 0.3, pin: true });
          searchResults.hidden = true;
        });
      });
      searchResults.querySelectorAll("button[data-node-ego]").forEach((button) => {
        button.addEventListener("click", () => {
          openEgoForMember(button.dataset.nodeEgo);
          searchResults.hidden = true;
          searchInput.blur();
        });
      });
    }

    searchInput.addEventListener("input", (event) => {
      renderSearchResults(event.target.value.trim().toLowerCase());
    });

    searchInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      const firstMatch = searchResults.querySelector("button[data-node]");
      if (firstMatch) {
        if (uiState.viewMode !== "graph" && uiState.viewMode !== "ego") switchView("graph");
        focusNode(firstMatch.dataset.node, { zoom: 0.3, pin: true });
      }
    });

    const VIEW_KEYS = { 1: "graph", 2: "matrix", 3: "ranked", 4: "ego", 5: "members" };

    document.addEventListener("keydown", (event) => {
      const tag = (event.target && event.target.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target.isContentEditable;

      if (event.key === "/" && !typing) {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
      }
      if (typing && event.key !== "Escape") return;

      if (event.key === "f" && !typing) {
        event.preventDefault();
        if (!isGraphView()) switchView("graph");
        fitGraph();
      } else if (event.key === "e" && !typing) {
        event.preventDefault();
        const memberId = activeMemberForEgo();
        if (memberId) openEgoForMember(memberId);
      } else if (event.key === "s" && !typing) {
        event.preventDefault();
        setSettingsOpen(!uiState.settingsOpen);
      } else if (event.key === "." && !typing) {
        event.preventDefault();
        setFocusMode(!uiState.focusMode);
      } else if (event.key === "Escape") {
        clearFocus();
        if (document.activeElement === searchInput) searchInput.blur();
      } else if (VIEW_KEYS[event.key]) {
        event.preventDefault();
        switchView(VIEW_KEYS[event.key]);
      }
    });

    window.addEventListener("resize", () => {
      if (uiState.viewMode === "matrix") scheduleAlternateViewRender();
      else if (isGraphView()) renderer.resize();
    });

    populateEgoCenterSelect();
    syncSettingsChrome();
    syncViewSettings();
    syncGraphPanelVisibility();
    syncSelectionDock();
    updateViewHint();
    renderLegend();
    renderLayoutHint();
    recomputeEgoNeighborhood();
    updateMeta();
    fitGraph();
  </script>
</body>
</html>
