# Generator configuration for congressgov code generation

output:
  # Output directories for generated code
  api_client: src/congressgov/_client/
  models: src/congressgov/models/
  middleware: src/congressgov/services/
  extensions: src/congressgov/services/extensions/

generation:
  # Generation behavior settings
  incremental: true # Preserve existing custom modifications
  preserve_custom: true # Keep sections marked with # CUSTOM:
  backup: true # Create backups before overwriting files
  format_output: true # Run isort/ruff on generated files

  # File operation settings
  backup_suffix: ".backup"
  custom_marker: "# CUSTOM:"
  generated_marker: "# GENERATED:"

api_client:
  # openapi-python-client configuration
  generator: openapi-python-client
  version: ">=0.25.3"
  package_name: "congressgov._client"
  config_path: codegen/config/openapi_client_config.yaml

  # Generation options
  options:
    meta: "none" # Don't include meta information
    url: null # Will be set from spec
    package_name: "congressgov._client"
    package_version: "1.0.0"
    package_description: "A Python client for the Congress.gov API"

models:
  # Pydantic model generation settings
  base_class: congressgov.models.base.model.Model
  use_datetime_parsing: true
  use_enum_values: true
  use_field_descriptions: true

  # Model organization
  entity_models_dir: entities/
  action_models_dir: actions/
  committee_models_dir: committees/
  communication_models_dir: communications/
  document_models_dir: documents/
  meeting_models_dir: meetings/
  nomination_models_dir: nominations/
  core_models_dir: core/
  base_models_dir: base/

middleware:
  # Middleware service generation settings
  base_service_class: congressgov.services.core.api_service.ApiService
  use_model_registry: true
  export_mappings: true
  export_parameters: true
  # Protected hand modules are skipped on regen unless sidecars are re-enabled.
  emit_review_sidecars: false
  # Legacy: when emit_review_sidecars is true, write *.generated.py next to protected files.
  review_sidecar_suffix: ".generated"

  # Service organization
  services_dir: src/congressgov/services/
  extensions_dir: src/congressgov/services/extensions/

extensions:
  # Extension method generation settings
  use_template_pattern: true
  register_methods: true
  generate_query_builders: true
  generate_convenience_methods: true

  # Query builder settings
  query_builder_class: _query_builder.CollectionQuery
  field_mapping_class: _query_builder.FieldMapping

registry:
  # Model registry generation settings
  auto_generate_mappings: true
  include_expansion_mappings: true
  cache_models: true

  # Generated artifact (hand-written model_registry.py stays protected)
  registry_file: src/congressgov/services/core/model_registry_generated.py

client_compat:
  allow_unmatched: false

entity_mappings:
  path: codegen/config/entity_mappings.yaml
  use_as_fallback: true

formatting:
  # Code formatting settings
  use_ruff: true
  use_isort: true

  # Ruff configuration
  ruff_line_length: 120

  # isort configuration
  isort_profile: black
  isort_multi_line: 3
  isort_include_trailing_comma: true
  isort_force_grid_wrap: 0
  isort_use_parentheses: true
  isort_ensure_newline_before_comments: true

logging:
  # Logging configuration
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: codegen.log
  console: true

# Paths/codegen must never overwrite (hand-maintained or optional-feature packages)
protected_paths:
  - src/congressgov/services/async_api/bill.py
  - src/congressgov/services/async_api/amendment.py
