      - name: billNumber
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: The bill number
        example: 1
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [ json, xml ]
          default: json
        description: Response format
      responses:
        '200':
          description: Bill details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'

