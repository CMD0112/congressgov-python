components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    Bill:
      type: object
      description: A Congressional bill
      properties:
        congress:
          type: integer
          description: The Congress number
          example: 118
        type:
          type: string
          enum: [ hr, s, hjres, sjres, hconres, sconres, hres, sres ]
          description: The bill type
          example: hr
        number:
          type: integer
          description: The bill number
          example: 1
        title:
          type: string
          description: The bill title
          example: "For the relief of John Doe"
        introducedDate:
          type: string
          format: date
          description: Date the bill was introduced
        originChamber:
          type: string
          enum: [ House, Senate ]
          description: Chamber where the bill originated
        isEnacted:
          type: boolean
          description: Whether the bill has been enacted into law
        latestAction:
          $ref: '#/components/schemas/LatestAction'
        sponsors:
          type: array
          items:
            $ref: '#/components/schemas/Sponsor'
        actions:
          $ref: '#/components/schemas/ActionsRef'
        amendments:
          $ref: '#/components/schemas/AmendmentsRef'
        committees:
          $ref: '#/components/schemas/CommitteesRef'
        cosponsors:
          $ref: '#/components/schemas/CosponsorsRef'
        relatedBills:
          $ref: '#/components/schemas/BillsRef'
        subjects:
          $ref: '#/components/schemas/SubjectsRef'
        summaries:
          $ref: '#/components/schemas/SummariesRef'
        textVersions:
          $ref: '#/components/schemas/TextVersionsRef'
        titles:
          $ref: '#/components/schemas/TitlesRef'

    BillResponse:
      type: object
      properties:
        bill:
          $ref: '#/components/schemas/Bill'

    Bills:
      type: object
      description: Collection of bills
      properties:
        bills:
          type: array
          items:
            $ref: '#/components/schemas/Bill'

    BillsResponse:
      type: object
      properties:
        bills:
          $ref: '#/components/schemas/Bills'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Amendment:
      type: object
      description: A Congressional amendment
      properties:
        congress:
          type: integer
          description: The Congress number
        type:
          type: string
          enum: [ hamdt, samdt ]
          description: The amendment type
        number:
          type: string
          description: The amendment number
        title:
          type: string
          description: The amendment title
        introducedDate:
          type: string
          format: date
          description: Date the amendment was introduced

    AmendmentResponse:
      type: object
      properties:
        amendment:
          $ref: '#/components/schemas/Amendment'

    Amendments:
      type: object
      description: Collection of amendments
      properties:
        amendments:
          type: array
          items:
            $ref: '#/components/schemas/Amendment'

    Member:
      type: object
      description: A member of Congress
      properties:
        bioguideId:
          type: string
          description: The bioguide ID
          example: A000374
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        fullName:
          type: string
          description: Full name
        state:
          type: string
          description: State represented
        district:
          type: integer
          description: District number (for House members)
        party:
          type: string
          description: Political party
        chamber:
          type: string
          enum: [ House, Senate ]
          description: Chamber of Congress

    MemberResponse:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/Member'

    Members:
      type: object
      description: Collection of members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    # === REFERENCE SCHEMAS ===
    LatestAction:
      type: object
      properties:
        actionDate:
          type: string
          format: date
        text:
          type: string

    Sponsor:
      type: object
      properties:
        bioguideId:
          type: string
        fullName:
          type: string
        party:
          type: string
        state:
          type: string

    ActionsRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    AmendmentsRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    CommitteesRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    CosponsorsRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    BillsRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    SubjectsRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    SummariesRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    TextVersionsRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    TitlesRef:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

    Actions:
      type: object
      description: Collection of actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'

    Action:
      type: object
      description: A legislative action
      properties:
        actionDate:
          type: string
          format: date
        text:
          type: string
        type:
          type: string

    ActionsResponse:
      type: object
      properties:
        actions:
          $ref: '#/components/schemas/Actions'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      description: Pagination information
      properties:
        count:
          type: integer
        next:
          type: string
        previous:
          type: string


