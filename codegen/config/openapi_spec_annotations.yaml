      x-entity-name: Bill
      x-endpoint-role: primary
      x-api-function: bill_details_sync
      x-model-config:
        base-class: Model
        collection-class: Bills
        items-field: bills
        module-path: congressgov.models.entities.bill
        service-path: congressgov.services.bill
        extension-path: congressgov.services.extensions.bill

      x-expansion-mappings:
        actions:
          endpoint: /bill/{congress}/{billType}/{billNumber}/actions
          api-function: bill_actions_sync
          model: Actions
          description: "Get actions taken on this bill"
        amendments:
          endpoint: /bill/{congress}/{billType}/{billNumber}/amendments
          api-function: bill_amendments_sync
          model: Amendments
          description: "Get amendments to this bill"
        committees:
          endpoint: /bill/{congress}/{billType}/{billNumber}/committees
          api-function: bill_committees_sync
          model: Committees
          description: "Get committees associated with this bill"
        cosponsors:
          endpoint: /bill/{congress}/{billType}/{billNumber}/cosponsors
          api-function: bill_cosponsors_sync
          model: Cosponsors
          description: "Get cosponsors of this bill"
        relatedBills:
          endpoint: /bill/{congress}/{billType}/{billNumber}/relatedbills
          api-function: bill_relatedbills_sync
          model: Bills
          description: "Get bills related to this bill"
        subjects:
          endpoint: /bill/{congress}/{billType}/{billNumber}/subjects
          api-function: bill_subjects_sync
          model: Subject
          description: "Get subjects associated with this bill"
        summaries:
          endpoint: /bill/{congress}/{billType}/{billNumber}/summaries
          api-function: bill_summaries_sync
          model: Summaries
          description: "Get summaries of this bill"
        textVersions:
          endpoint: /bill/{congress}/{billType}/{billNumber}/text
          api-function: bill_text_sync
          model: TextVersions
          description: "Get text versions of this bill"
        titles:
          endpoint: /bill/{congress}/{billType}/{billNumber}/titles
          api-function: bill_titles_sync
          model: Titles
          description: "Get titles of this bill"

