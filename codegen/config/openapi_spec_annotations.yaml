        type:
          enum: LegislationType
          shorthand: true
          variations: [ "hr", "s", "hjres", "sjres", "hconres", "sconres", "hres", "sres" ]
          description: "Bill type with shorthand support"
        originChamber:
          enum: Chamber
          shorthand: true
          variations: [ "house", "h", "senate", "s" ]
          description: "Chamber of origin with shorthand support"

